---
name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - master

  push:
    branches:
      - main
      - master

jobs:

  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Validate Kubernetes YAML
        run: |
          find manifests/ \
            -type f \
            \( -name "*.yaml" -o -name "*.yml" \) \
            -exec kubectl apply \
            --dry-run=client \
            --validate=false \
            -f {} \;

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yml .

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Run Helm Lint Frontend
        run: helm lint charts/frontend

      - name: Run Helm Lint Backend
        run: helm lint charts/backend

      - name: Run Helm Lint PostgreSQL
        run: helm lint charts/postgres

  security:
    name: Kubernetes Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify .trivyignore exists
        run: |
          ls -la
          test -f .trivyignore

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignorefile: .trivyignore

  shellcheck:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

  completed:
    name: CI Status
    runs-on: ubuntu-latest

    needs:
      - validate
      - yaml-lint
      - helm-lint
      - security
      - shellcheck

    steps:
      - name: Success
        run: |
          echo "All CI checks passed successfully."
