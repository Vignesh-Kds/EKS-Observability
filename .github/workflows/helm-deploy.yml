---
name: Helm Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "charts/**"

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: vickycluster
  NAMESPACE: monitoring

jobs:
  helm-deploy:
    name: Deploy Helm Charts to Amazon EKS
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}"

      - name: Verify Cluster
        run: |
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes

      - name: Create Namespace
        run: |
          kubectl create namespace "${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm Lint
        run: |
          helm lint charts/postgres
          helm lint charts/backend
          helm lint charts/frontend

      - name: Existing Helm Releases
        run: |
          helm list -A

      - name: Deploy PostgreSQL
        run: |
          helm upgrade --install postgres \
            ./charts/postgres \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --wait \
            --timeout 10m

      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status deployment/postgres-postgres \
            -n "${NAMESPACE}" \
            --timeout=300s

      - name: Deploy Backend
        run: |
          helm upgrade --install backend \
            ./charts/backend \
            --namespace "${NAMESPACE}" \
            --wait \
            --timeout 10m

      - name: Wait for Backend
        run: |
          kubectl rollout status deployment/backend-backend \
            -n "${NAMESPACE}" \
            --timeout=300s

      - name: Deploy Frontend
        run: |
          helm upgrade --install frontend \
            ./charts/frontend \
            --namespace "${NAMESPACE}" \
            --wait \
            --timeout 10m

      - name: Wait for Frontend
        run: |
          kubectl rollout status deployment/frontend \
            -n "${NAMESPACE}" \
            --timeout=300s || \
          kubectl rollout status deployment/frontend-frontend \
            -n "${NAMESPACE}" \
            --timeout=300s

      - name: Verify Helm Releases
        run: |
          helm list -n "${NAMESPACE}"

      - name: Verify Kubernetes Resources
        run: |
          kubectl get deployments -n "${NAMESPACE}"
          kubectl get pods -o wide -n "${NAMESPACE}"
          kubectl get svc -n "${NAMESPACE}"
          kubectl get ingress -n "${NAMESPACE}" || true

      - name: Describe Pods on Failure
        if: failure()
        run: |
          kubectl get events -n "${NAMESPACE}" --sort-by=.lastTimestamp
          kubectl describe pods -n "${NAMESPACE}"

      - name: Deployment Summary
        run: |
          echo "======================================"
          echo "Deployment completed successfully!"
          echo "Cluster   : ${CLUSTER_NAME}"
          echo "Region    : ${AWS_REGION}"
          echo "Namespace : ${NAMESPACE}"
          echo "======================================"
