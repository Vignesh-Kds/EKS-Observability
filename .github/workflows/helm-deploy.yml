---
name: Helm Deploy

on:

  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "charts/**"


env:

  AWS_REGION: ap-south-1
  CLUSTER_NAME: vickycluster
  NAMESPACE: monitoring


jobs:

  helm-deploy:

    name: Deploy Helm Charts to Amazon EKS

    runs-on: ubuntu-latest

    permissions:

      contents: read


    steps:


      - name: Checkout Repository
        uses: actions/checkout@v4



      ############################################
      # AWS
      ############################################

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: "${{ secrets.AWS_ACCESS_KEY_ID }}"

          aws-secret-access-key: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"

          aws-region: "${{ env.AWS_REGION }}"





      ############################################
      # Tools
      ############################################

      - name: Install kubectl

        uses: azure/setup-kubectl@v4

        with:

          version: latest



      - name: Install Helm

        uses: azure/setup-helm@v4

        with:

          version: latest





      ############################################
      # Kubernetes Connection
      ############################################

      - name: Configure kubeconfig

        shell: bash

        run: |

          set -euo pipefail


          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}"





      - name: Verify Cluster

        shell: bash

        run: |

          set -euo pipefail


          kubectl cluster-info


          kubectl get nodes





      ############################################
      # Namespace
      ############################################

      - name: Create Namespace

        shell: bash

        run: |

          kubectl create namespace "${NAMESPACE}" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -





      ############################################
      # Helm Validation
      ############################################

      - name: Helm Lint

        shell: bash

        run: |

          helm lint charts/postgres

          helm lint charts/backend

          helm lint charts/frontend





      - name: Existing Helm Releases

        run: |

          helm list -A





      ############################################
      # PostgreSQL
      ############################################

      - name: Deploy PostgreSQL

        shell: bash

        run: |

          set -euo pipefail


          helm upgrade --install postgres \
            ./charts/postgres \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --wait \
            --timeout 15m





      - name: Verify PostgreSQL

        shell: bash

        run: |

          set -euo pipefail


          echo "Checking PostgreSQL resources"


          kubectl get pods \
            -n "${NAMESPACE}"


          kubectl get pvc \
            -n "${NAMESPACE}"


          kubectl get statefulset \
            -n "${NAMESPACE}" || true


          kubectl get deployment \
            -n "${NAMESPACE}" || true





      ############################################
      # Backend
      ############################################

      - name: Deploy Backend

        shell: bash

        run: |

          set -euo pipefail


          helm upgrade --install backend \
            ./charts/backend \
            --namespace "${NAMESPACE}" \
            --wait \
            --timeout 15m





      - name: Verify Backend

        run: |

          kubectl get pods \
            -n "${NAMESPACE}"





      ############################################
      # Frontend
      ############################################

      - name: Deploy Frontend

        shell: bash

        run: |

          set -euo pipefail


          helm upgrade --install frontend \
            ./charts/frontend \
            --namespace "${NAMESPACE}" \
            --wait \
            --timeout 15m





      ############################################
      # Verification
      ############################################

      - name: Verify Helm Releases

        run: |

          helm list \
            -n "${NAMESPACE}"





      - name: Verify Kubernetes Resources

        run: |

          kubectl get all \
            -n "${NAMESPACE}"


          kubectl get pvc \
            -n "${NAMESPACE}"


          kubectl get ingress \
            -n "${NAMESPACE}" \
            || true





      ############################################
      # Failure Debug
      ############################################

      - name: Debug Deployment Failure

        if: failure()

        shell: bash

        run: |

          echo "===== EVENTS ====="


          kubectl get events \
            -n "${NAMESPACE}" \
            --sort-by=.lastTimestamp



          echo "===== PODS ====="


          kubectl get pods \
            -n "${NAMESPACE}"



          echo "===== DESCRIBE ====="


          kubectl describe pods \
            -n "${NAMESPACE}"





      - name: Deployment Summary

        run: |

          echo "======================================"

          echo "Helm Deployment Completed"

          echo "Cluster   : ${CLUSTER_NAME}"

          echo "Region    : ${AWS_REGION}"

          echo "Namespace : ${NAMESPACE}"

          echo "======================================"
