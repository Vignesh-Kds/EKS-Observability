---
name: Security Scan

"on":
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  schedule:
    - cron: "0 2 * * 1"  # Every Monday at 02:00 UTC

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-config:
    name: Trivy Kubernetes Configuration Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif

  kube-linter:
    name: Kubernetes Manifest Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run KubeLinter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: .

  kube-score:
    name: Kubernetes Best Practices Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install kube-score
        run: |
          wget \
            https://github.com/zegl/kube-score/releases/latest/download/kube-score_linux_amd64
          chmod +x kube-score_linux_amd64
          sudo mv \
            kube-score_linux_amd64 \
            /usr/local/bin/kube-score

      - name: Run kube-score
        run: |
          find . -type f \
            \( -name "*.yaml" -o -name "*.yml" \) \
            -not -path "./.github/*" \
            -exec kube-score score {} \;

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run YAML Lint
        uses: ibiqlik/action-yamllint@v3

  shellcheck:
    name: Shell Script Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest

    needs:
      - trivy-config
      - kube-linter
      - kube-score
      - yamllint
      - shellcheck

    steps:
      - name: Summary
        run: |
          echo "===================================="
          echo "Security scanning completed successfully."
          echo "===================================="
