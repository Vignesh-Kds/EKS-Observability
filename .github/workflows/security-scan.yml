---
name: Security Scan

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  schedule:
    - cron: "0 2 * * 1"

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-config:
    name: Trivy Kubernetes Configuration Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif

  kube-linter:
    name: Kubernetes Manifest Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run KubeLinter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: .

  kube-score:
    name: Kubernetes Best Practices Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run kube-score
        uses: zegl/kube-score-action@v1
        with:
          paths: |
            charts
            manifests

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3

  shellcheck:
    name: Shell Script Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest

    needs:
      - trivy-config
      - kube-linter
      - kube-score
      - yamllint
      - shellcheck

    if: always()

    steps:
      - name: Summary
        run: |
          echo "===================================="
          echo "Security Scan Summary"
          echo "===================================="
          echo "Trivy       : ${{ needs.trivy-config.result }}"
          echo "KubeLinter  : ${{ needs.kube-linter.result }}"
          echo "Kube-score  : ${{ needs.kube-score.result }}"
          echo "Yamllint    : ${{ needs.yamllint.result }}"
          echo "ShellCheck  : ${{ needs.shellcheck.result }}"
          echo "===================================="
