---
name: Security Scan

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:

  trivy:
    name: Trivy Configuration Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  kube-linter:
    name: Kubernetes Manifest Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Render Backend Chart
        run: |
          helm dependency update charts/backend || true
          helm template test-release charts/backend > backend.yaml

      - name: Render Frontend Chart
        run: |
          helm dependency update charts/frontend || true
          helm template test-release charts/frontend > frontend.yaml

      - name: Prepare rendered manifests
        run: |
          mkdir rendered
          mv backend.yaml rendered/
          mv frontend.yaml rendered/

      - name: Run KubeLinter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: rendered

  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: kubernetes,helm,terraform
          quiet: true

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .

  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest

    if: always()

    needs:
      - trivy
      - kube-linter
      - checkov
      - yamllint
      - shellcheck

    steps:
      - name: Print Summary
        run: |
          echo "=========================================="
          echo "Security Scan Summary"
          echo "=========================================="
          echo "Trivy      : ${{ needs.trivy.result }}"
          echo "KubeLinter : ${{ needs.kube-linter.result }}"
          echo "Checkov    : ${{ needs.checkov.result }}"
          echo "yamllint   : ${{ needs.yamllint.result }}"
          echo "ShellCheck : ${{ needs.shellcheck.result }}"
          echo "=========================================="
