---
name: Security Scan

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:

  trivy:
    name: Trivy Config Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  kube-linter:
    name: KubeLinter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run KubeLinter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: .

  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: kubernetes,helm,terraform

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

  summary:
    name: Security Summary
    runs-on: ubuntu-latest

    if: always()

    needs:
      - trivy
      - kube-linter
      - checkov
      - yamllint
      - shellcheck

    steps:
      - name: Print Results
        run: |
          echo "======================================"
          echo "Security Scan Summary"
          echo "======================================"
          echo "Trivy      : ${{ needs.trivy.result }}"
          echo "KubeLinter : ${{ needs.kube-linter.result }}"
          echo "Checkov    : ${{ needs.checkov.result }}"
          echo "yamllint   : ${{ needs.yamllint.result }}"
          echo "ShellCheck : ${{ needs.shellcheck.result }}"
          echo "======================================"
