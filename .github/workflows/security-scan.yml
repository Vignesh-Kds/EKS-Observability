```yaml
---
name: Security Scan

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:

  #########################################################
  # Trivy
  #########################################################

  trivy:
    name: Trivy Configuration Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  #########################################################
  # Kubernetes Manifest Lint
  #########################################################

  kube-linter:
    name: Kubernetes Manifest Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Render Backend Chart
        run: |
          helm dependency update charts/backend || true
          helm template backend charts/backend > backend.yaml

      - name: Render Frontend Chart
        run: |
          helm dependency update charts/frontend || true
          helm template frontend charts/frontend > frontend.yaml

      - name: Render PostgreSQL Chart
        run: |
          helm dependency update charts/postgres || true
          helm template postgres charts/postgres > postgres.yaml

      - name: Prepare Rendered Manifests
        run: |
          mkdir rendered
          mv backend.yaml rendered/
          mv frontend.yaml rendered/
          mv postgres.yaml rendered/

      - name: Run KubeLinter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: rendered

  #########################################################
  # Checkov
  #########################################################

  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Render Helm Charts
        run: |
          mkdir rendered

          helm dependency update charts/backend || true
          helm template backend charts/backend > rendered/backend.yaml

          helm dependency update charts/frontend || true
          helm template frontend charts/frontend > rendered/frontend.yaml

          helm dependency update charts/postgres || true
          helm template postgres charts/postgres > rendered/postgres.yaml

      - name: Run Checkov (Rendered Kubernetes Manifests)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: rendered
          framework: kubernetes
          quiet: true
          output_format: sarif
          output_file_path: results.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

  #########################################################
  # YAML Lint
  #########################################################

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .

  #########################################################
  # ShellCheck
  #########################################################

  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

  #########################################################
  # Summary
  #########################################################

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest

    if: always()

    needs:
      - trivy
      - kube-linter
      - checkov
      - yamllint
      - shellcheck

    steps:
      - name: Print Summary
        run: |
          echo "=========================================="
          echo "Security Scan Summary"
          echo "=========================================="
          echo "Trivy      : ${{ needs.trivy.result }}"
          echo "KubeLinter : ${{ needs.kube-linter.result }}"
          echo "Checkov    : ${{ needs.checkov.result }}"
          echo "yamllint   : ${{ needs.yamllint.result }}"
          echo "ShellCheck : ${{ needs.shellcheck.result }}"
          echo "=========================================="
