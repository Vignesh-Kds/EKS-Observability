---
name: Security Scan

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:

  trivy:
    name: Trivy Configuration Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  kube-linter:
    name: Kubernetes Manifest Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run KubeLinter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: .

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

  summary:
    name: Security Summary
    runs-on: ubuntu-latest

    needs:
      - trivy
      - kube-linter
      - yamllint
      - shellcheck

    if: always()

    steps:
      - name: Print Summary
        run: |
          echo "========================================"
          echo "Security Scan Summary"
          echo "========================================"
          echo "Trivy      : ${{ needs.trivy.result }}"
          echo "KubeLinter : ${{ needs.kube-linter.result }}"
          echo "yamllint   : ${{ needs.yamllint.result }}"
          echo "ShellCheck : ${{ needs.shellcheck.result }}"
          echo "========================================"
