---
name: Infrastructure Deployment

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "manifests/**"

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: vickycluster

jobs:
  infrastructure:
    name: Deploy Infrastructure to Amazon EKS
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}"

      - name: Verify Cluster Connectivity
        run: |
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes

      - name: Add Helm Repositories
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

      - name: Install NGINX Ingress Controller
        run: |
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --wait \
            --timeout 10m

      - name: Verify Ingress Controller
        run: |
          kubectl rollout status deployment/ingress-nginx-controller \
            -n ingress-nginx \
            --timeout=300s

      - name: Create Production Namespace
        run: |
          kubectl apply -f manifests/namespace.yaml

      - name: Apply StorageClass
        run: |
          kubectl apply -f manifests/storageclass.yaml

      - name: Apply Network Policy
        run: |
          kubectl apply -f manifests/networkpolicy.yaml

      - name: Apply RBAC
        run: |
          kubectl apply -R -f manifests/rbac/

      - name: Apply ClusterIssuer
        run: |
          if kubectl get crd clusterissuers.cert-manager.io >/dev/null 2>&1; then
            kubectl apply -f manifests/clusterissuer.yaml
          else
            echo "cert-manager CRDs not found. Skipping ClusterIssuer."
          fi

      - name: Verify Infrastructure
        run: |
          kubectl get ns
          kubectl get ingressclass
          kubectl get storageclass
          kubectl get clusterrole | grep app || true
          kubectl get pods -n ingress-nginx
          kubectl get svc -n ingress-nginx

      - name: Describe Resources on Failure
        if: failure()
        run: |
          echo "===== Ingress Pods ====="
          kubectl get pods -n ingress-nginx

          echo "===== Events ====="
          kubectl get events -A --sort-by=.lastTimestamp

          echo "===== Ingress Controller ====="
          kubectl describe deployment ingress-nginx-controller -n ingress-nginx || true

      - name: Infrastructure Deployment Summary
        run: |
          echo "=========================================="
          echo "Infrastructure deployment completed"
          echo "Cluster : ${CLUSTER_NAME}"
          echo "Region  : ${AWS_REGION}"
          echo "=========================================="
