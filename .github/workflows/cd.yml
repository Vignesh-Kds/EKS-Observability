---
name: CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: vickycluster
  NAMESPACE: monitoring

jobs:
  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}"

      - name: Verify Cluster Connectivity
        run: |
          kubectl version --client
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes

      - name: Create Namespace
        run: |
          kubectl create namespace "${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f manifests/

      - name: Wait for Deployments
        run: |
          kubectl rollout status deployment/prometheus -n "${NAMESPACE}" --timeout=300s
          kubectl rollout status deployment/grafana -n "${NAMESPACE}" --timeout=300s
          kubectl rollout status deployment/loki -n "${NAMESPACE}" --timeout=300s
          kubectl rollout status deployment/alertmanager -n "${NAMESPACE}" --timeout=300s

      - name: Verify Resources
        run: |
          echo "========== Pods =========="
          kubectl get pods -n "${NAMESPACE}"

          echo "========== Services =========="
          kubectl get svc -n "${NAMESPACE}"

          echo "========== Deployments =========="
          kubectl get deployments -n "${NAMESPACE}"

          echo "========== Ingress =========="
          kubectl get ingress -n "${NAMESPACE}" || true

      - name: Deployment Summary
        run: |
          echo "========================================"
          echo "Deployment completed successfully!"
          echo "Cluster   : ${CLUSTER_NAME}"
          echo "Region    : ${AWS_REGION}"
          echo "Namespace : ${NAMESPACE}"
          echo "========================================"
