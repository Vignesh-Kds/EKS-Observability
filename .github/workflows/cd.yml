---
name: Infrastructure Deployment
on:
  workflow_dispatch: null
  push:
    branches:
      - main
      - master
    paths:
      - manifests/**
env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: vickycluster
  EBS_ROLE_NAME: AmazonEKS_EBS_CSI_DriverRole
jobs:
  infrastructure:
    name: Deploy Infrastructure to EKS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Install eksctl
        shell: bash
        run: >
          set -euo pipefail

          curl --silent --location \
            "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" \
            -o /tmp/eksctl.tar.gz
          tar -xzf /tmp/eksctl.tar.gz \
            -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin/eksctl

          eksctl version
      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}"
      - name: Verify Cluster
        shell: bash
        run: |
          set -euo pipefail
          kubectl cluster-info
          kubectl get nodes
      - name: Enable OIDC Provider
        shell: bash
        run: |
          set -euo pipefail
          eksctl utils associate-iam-oidc-provider \
            --region "${AWS_REGION}" \
            --cluster "${CLUSTER_NAME}" \
            --approve
      - name: Create EBS CSI IAM Role
        shell: bash
        run: |
          set -euo pipefail
          if aws iam get-role \
            --role-name "${EBS_ROLE_NAME}" \
            >/dev/null 2>&1
          then
            echo "IAM role exists"
          else
            eksctl create iamserviceaccount \
              --cluster "${CLUSTER_NAME}" \
              --namespace kube-system \
              --name ebs-csi-controller-sa \
              --role-name "${EBS_ROLE_NAME}" \
              --attach-policy-arn \
              arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy \
              --approve
          fi
      - name: Install EBS CSI Addon
        shell: bash
        run: |
          set -euo pipefail
          ROLE_ARN=$(aws iam get-role \
            --role-name "${EBS_ROLE_NAME}" \
            --query Role.Arn \
            --output text)
          if aws eks describe-addon \
            --cluster-name "${CLUSTER_NAME}" \
            --addon-name aws-ebs-csi-driver \
            >/dev/null 2>&1
          then
            echo "Addon exists"
          else
            aws eks create-addon \
              --cluster-name "${CLUSTER_NAME}" \
              --addon-name aws-ebs-csi-driver \
              --service-account-role-arn "${ROLE_ARN}" \
              --resolve-conflicts OVERWRITE
          fi
      - name: Wait EBS CSI
        run: |
          aws eks wait addon-active \
            --cluster-name "${CLUSTER_NAME}" \
            --addon-name aws-ebs-csi-driver
      - name: Install Metrics Server
        run: >

          if kubectl get deployment metrics-server -n kube-system >/dev/null 2>&1
                  then
                         echo "Metrics Server already installed"
                  else
                         kubectl apply \
                                -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

                          kubectl rollout status deployment/metrics-server \
                                -n kube-system \
                                --timeout=5m
          fi
      - name: Add Helm Repositories
        run: >
          helm repo add jetstack https://charts.jetstack.io
            helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
            helm repo add grafana https://grafana.github.io/helm-charts
            helm repo update
      - name: Cleanup cert-manager
        shell: bash
        run: |
          set -euo pipefail

          kubectl get crd \
            | grep cert-manager.io \
            | awk '{print $1}' \
            | xargs -r kubectl delete crd || true

          kubectl delete namespace cert-manager \
            --ignore-not-found=true
      - name: Install cert-manager
        run: |
          helm upgrade --install cert-manager \
            jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 10m
      - name: Cleanup ingress-nginx
        shell: bash
        run: |
          set -euo pipefail
          helm uninstall ingress-nginx \
            -n ingress-nginx \
            || true
          kubectl delete namespace ingress-nginx \
            --ignore-not-found=true \
            || true
          kubectl delete serviceaccount \
            ingress-nginx \
            -n ingress-nginx \
            --ignore-not-found=true \
            || true
          kubectl delete clusterrole \
            ingress-nginx \
            --ignore-not-found=true \
            || true
          kubectl delete clusterrole \
            ingress-nginx-admission \
            --ignore-not-found=true \
            || true
          kubectl delete clusterrolebinding \
            ingress-nginx \
            --ignore-not-found=true \
            || true
          kubectl delete clusterrolebinding \
            ingress-nginx-admission \
            --ignore-not-found=true \
            || true
          kubectl delete ingressclass nginx \
            --ignore-not-found=true \
            || true
          kubectl delete ingressclass ingress-nginx \
            --ignore-not-found=true \
            || true
          kubectl delete validatingwebhookconfiguration \
            ingress-nginx-admission \
            --ignore-not-found=true \
            || true
      - name: Install ingress-nginx
        run: |
          helm upgrade --install ingress-nginx \
            ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --wait \
            --timeout 10m
      - name: Install kube-prometheus-stack
        run: |

          helm upgrade --install \
            kube-prometheus-stack \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --wait \
            --timeout 20m
      - name: Install Loki Stack
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
            helm repo update
            helm upgrade --install loki-stack grafana/loki-stack \
            --namespace monitoring \
            --create-namespace \
            --set grafana.enabled=false \
            --set prometheus.enabled=false \
            --wait \
            --timeout 15m
      - name: Install Promtail
        run: |

          helm upgrade --install \
             promtail \
             grafana/promtail \
             --namespace monitoring \
             --wait \
             --timeout 10m \
             --set config.clients[0].url=http://loki:3100/loki/api/v1/push

          ############################################
          # APPLY MANIFESTS
          ############################################
      - name: Apply Namespace
        run: |
          kubectl apply \
            -f manifests/namespace.yaml
      - name: Apply StorageClass
        run: |
          kubectl apply \
            -f manifests/storageclass.yaml
      - name: Apply NetworkPolicy
        run: |
          kubectl apply \
            -f manifests/networkpolicy.yaml
      - name: Apply RBAC
        run: |
          kubectl apply \
            -R \
            -f manifests/rbac/
      - name: Apply ClusterIssuer
        run: |
          kubectl apply \
            -f manifests/clusterissuer.yaml
      - name: Verify Infrastructure
        run: |
          kubectl get nodes
          kubectl get storageclass
          kubectl get pods \
            -n kube-system \
            | grep ebs
          kubectl get pods \
            -n cert-manager
          kubectl get pods \
            -n ingress-nginx

          ############################################
          # VERIFY MONITORING
          ############################################
      - name: Verify Monitoring Stack
        run: |

          echo "Pods"
          kubectl get pods -n monitoring

          echo
          echo "Services"
          kubectl get svc -n monitoring

          echo
          echo "PVC"
          kubectl get pvc -n monitoring

          echo
          echo "Ingress"
          kubectl get ingress -A
      - name: Debug Failure
        if: failure()
        run: |
          kubectl get events \
            -A \
            --sort-by=.lastTimestamp
          kubectl get pods \
            -A -o wide
          kubectl describe pods -n monitoring

          kubectl get svc -A

          kubectl get pvc -A
