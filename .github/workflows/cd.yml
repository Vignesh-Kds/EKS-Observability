---
name: Infrastructure Deployment

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "manifests/**"

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: vickycluster

jobs:

  infrastructure:

    name: Deploy Infrastructure to Amazon EKS
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      ############################################
      # AWS Authentication
      ############################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ############################################
      # Install Tools
      ############################################

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest


      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      ############################################
      # Kubernetes Connection
      ############################################

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}"


      - name: Verify Cluster Connectivity
        run: |
          aws sts get-caller-identity
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes

      ############################################
      # AWS EBS CSI DRIVER
      ############################################

      - name: Install AWS EBS CSI Driver
        run: |

          if aws eks list-addons \
            --cluster-name "${CLUSTER_NAME}" \
            --query addons \
            --output text | grep -q aws-ebs-csi-driver
          then

            echo "AWS EBS CSI Driver already installed"

          else

            echo "Installing AWS EBS CSI Driver"

            aws eks create-addon \
              --cluster-name "${CLUSTER_NAME}" \
              --addon-name aws-ebs-csi-driver

          fi

      - name: Wait For EBS CSI Driver
        run: |

          aws eks wait addon-active \
            --cluster-name "${CLUSTER_NAME}" \
            --addon-name aws-ebs-csi-driver

      - name: Verify EBS CSI Driver
        run: |

          kubectl get pods -n kube-system | grep ebs

      ############################################
      # HELM REPOSITORIES
      ############################################

      - name: Add Helm Repositories
        run: |

          helm repo add ingress-nginx \
            https://kubernetes.github.io/ingress-nginx

          helm repo add jetstack \
            https://charts.jetstack.io

          helm repo update

      ############################################
      # CERT MANAGER
      ############################################

      - name: Install cert-manager
        run: |

          helm upgrade --install cert-manager \
            jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 10m


      - name: Verify cert-manager
        run: |

          kubectl rollout status \
            deployment/cert-manager \
            -n cert-manager \
            --timeout=300s

          kubectl rollout status \
            deployment/cert-manager-webhook \
            -n cert-manager \
            --timeout=300s

          kubectl rollout status \
            deployment/cert-manager-cainjector \
            -n cert-manager \
            --timeout=300s

      ############################################
      # NGINX INGRESS CONTROLLER
      ############################################

      - name: Install NGINX Ingress Controller
        run: |

          helm upgrade --install ingress-nginx \
            ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --wait \
            --timeout 10m

      - name: Verify Ingress Controller
        run: |

          kubectl rollout status \
            deployment/ingress-nginx-controller \
            -n ingress-nginx \
            --timeout=300s

      ############################################
      # APPLICATION INFRASTRUCTURE
      ############################################

      - name: Create Production Namespace
        run: |

          kubectl apply \
            -f manifests/namespace.yaml



      - name: Apply StorageClass
        run: |

          kubectl apply \
            -f manifests/storageclass.yaml

      - name: Apply Network Policies
        run: |

          kubectl apply \
            -f manifests/networkpolicy.yaml

      - name: Apply RBAC
        run: |

          kubectl apply \
            -R \
            -f manifests/rbac/

      ############################################
      # CERTIFICATE ISSUER
      ############################################

      - name: Apply ClusterIssuer
        run: |

          kubectl apply \
            -f manifests/clusterissuer.yaml

      ############################################
      # VALIDATION
      ############################################

      - name: Verify Infrastructure
        run: |

          echo "===== Namespaces ====="
          kubectl get ns


          echo "===== Storage ====="
          kubectl get storageclass

          echo "===== Ingress ====="
          kubectl get ingressclass


          echo "===== EBS CSI ====="
          kubectl get pods \
            -n kube-system | grep ebs

          echo "===== Cert Manager ====="
          kubectl get pods \
            -n cert-manager

          echo "===== NGINX ====="
          kubectl get pods \
            -n ingress-nginx

          echo "===== Services ====="
          kubectl get svc \
            -n ingress-nginx

      ############################################
      # FAILURE DEBUG
      ############################################

      - name: Describe Resources On Failure
        if: failure()
        run: |

          echo "===== Cluster Events ====="

          kubectl get events \
            -A \
            --sort-by=.lastTimestamp

          echo "===== EBS CSI ====="

          kubectl get pods \
            -n kube-system | grep ebs || true

          echo "===== Cert Manager ====="

          kubectl get pods \
            -n cert-manager || true

          echo "===== Ingress ====="

          kubectl get pods \
            -n ingress-nginx || true

      ############################################
      # SUMMARY
      ############################################

      - name: Deployment Summary
        run: |

          echo "======================================"
          echo "Infrastructure Deployment Completed"
          echo "Cluster : ${CLUSTER_NAME}"
          echo "Region  : ${AWS_REGION}"
          echo "======================================"
