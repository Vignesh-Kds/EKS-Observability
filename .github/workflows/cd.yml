---
name: Infrastructure Deployment

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "manifests/**"

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: vickycluster
  EBS_ROLE_NAME: AmazonEKS_EBS_CSI_DriverRole


jobs:

  infrastructure:

    name: Deploy Infrastructure to Amazon EKS
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws-region: "${{ env.AWS_REGION }}"


      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest


      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest


      - name: Install eksctl
        uses: nexxyz/eksctl-action@v0.1.1


      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --name "${CLUSTER_NAME}" \
            --region "${AWS_REGION}"


      - name: Verify Cluster Connectivity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          kubectl cluster-info

          kubectl get nodes



      - name: Create EBS CSI IAM Role
        shell: bash
        run: |
          set -euo pipefail

          if aws iam get-role \
            --role-name "${EBS_ROLE_NAME}" \
            >/dev/null 2>&1
          then
            echo "EBS CSI IAM role already exists"
          else
            echo "Creating EBS CSI IAM role"

            eksctl create iamserviceaccount \
              --cluster "${CLUSTER_NAME}" \
              --namespace kube-system \
              --name ebs-csi-controller-sa \
              --role-name "${EBS_ROLE_NAME}" \
              --attach-policy-arn \
              arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy \
              --approve
          fi



      - name: Install AWS EBS CSI Driver
        shell: bash
        run: |
          set -euo pipefail

          ROLE_ARN=$(aws iam get-role \
            --role-name "${EBS_ROLE_NAME}" \
            --query "Role.Arn" \
            --output text)


          if aws eks describe-addon \
            --cluster-name "${CLUSTER_NAME}" \
            --addon-name aws-ebs-csi-driver \
            >/dev/null 2>&1
          then
            echo "EBS CSI addon already exists"
          else
            echo "Installing EBS CSI addon"

            aws eks create-addon \
              --cluster-name "${CLUSTER_NAME}" \
              --addon-name aws-ebs-csi-driver \
              --service-account-role-arn "${ROLE_ARN}" \
              --resolve-conflicts OVERWRITE
          fi



      - name: Wait For EBS CSI Driver
        shell: bash
        run: |
          set -euo pipefail

          aws eks wait addon-active \
            --cluster-name "${CLUSTER_NAME}" \
            --addon-name aws-ebs-csi-driver



      - name: Verify EBS CSI Driver
        shell: bash
        run: |
          set -euo pipefail

          kubectl get pods \
            -n kube-system \
            | grep ebs



      - name: Add Helm Repositories
        shell: bash
        run: |
          set -euo pipefail

          helm repo add ingress-nginx \
            https://kubernetes.github.io/ingress-nginx

          helm repo add jetstack \
            https://charts.jetstack.io

          helm repo update



      - name: Install cert-manager
        shell: bash
        run: |
          set -euo pipefail

          helm upgrade --install cert-manager \
            jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 10m



      - name: Verify cert-manager
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status \
            deployment/cert-manager \
            -n cert-manager \
            --timeout=300s

          kubectl rollout status \
            deployment/cert-manager-webhook \
            -n cert-manager \
            --timeout=300s



      - name: Install NGINX Ingress Controller
        shell: bash
        run: |
          set -euo pipefail

          helm upgrade --install ingress-nginx \
            ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --wait \
            --timeout 10m



      - name: Verify NGINX Controller
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status \
            deployment/ingress-nginx-controller \
            -n ingress-nginx \
            --timeout=300s



      - name: Apply Namespace
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -f manifests/namespace.yaml



      - name: Apply StorageClass
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -f manifests/storageclass.yaml



      - name: Apply Network Policies
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -f manifests/networkpolicy.yaml



      - name: Apply RBAC
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -R \
            -f manifests/rbac/



      - name: Apply ClusterIssuer
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -f manifests/clusterissuer.yaml



      - name: Verify Infrastructure
        shell: bash
        run: |
          set -euo pipefail

          echo "Namespaces"
          kubectl get ns

          echo "Storage Classes"
          kubectl get storageclass

          echo "Ingress Classes"
          kubectl get ingressclass

          echo "EBS CSI"
          kubectl get pods -n kube-system | grep ebs

          echo "cert-manager"
          kubectl get pods -n cert-manager

          echo "Ingress Controller"
          kubectl get pods -n ingress-nginx



      - name: Debug On Failure
        if: failure()
        shell: bash
        run: |
          set +e

          kubectl get events \
            -A \
            --sort-by=.lastTimestamp

          kubectl get pods \
            -A



      - name: Deployment Summary
        shell: bash
        run: |
          echo "===================================="
          echo "Infrastructure Deployment Completed"
          echo "Cluster : ${CLUSTER_NAME}"
          echo "Region  : ${AWS_REGION}"
          echo "===================================="
