---
name: Infrastructure Deployment

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "manifests/**"

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: vickycluster
  EBS_ROLE_NAME: AmazonEKS_EBS_CSI_DriverRole


jobs:
  infrastructure:
    name: Deploy Infrastructure to EKS
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws-region: "${{ env.AWS_REGION }}"


      - name: Install kubectl
        uses: azure/setup-kubectl@v4


      - name: Install Helm
        uses: azure/setup-helm@v4


      - name: Install eksctl
        shell: bash
        run: |
          set -euo pipefail

          curl --silent --location \
            "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" \
            -o /tmp/eksctl.tar.gz

          tar -xzf /tmp/eksctl.tar.gz \
            -C /tmp

          sudo mv /tmp/eksctl /usr/local/bin/eksctl

          eksctl version


      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}"


      - name: Verify Cluster Connectivity
        shell: bash
        run: |
          set -euo pipefail

          kubectl cluster-info

          kubectl get nodes


      - name: Create EBS CSI IAM Role
        shell: bash
        run: |
          set -euo pipefail

          if aws iam get-role \
            --role-name "${EBS_ROLE_NAME}" \
            >/dev/null 2>&1
          then
            echo "EBS CSI role already exists"
          else
            eksctl create iamserviceaccount \
              --cluster "${CLUSTER_NAME}" \
              --namespace kube-system \
              --name ebs-csi-controller-sa \
              --role-name "${EBS_ROLE_NAME}" \
              --attach-policy-arn \
              arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy \
              --approve
          fi


      - name: Install AWS EBS CSI Driver
        shell: bash
        run: |
          set -euo pipefail

          ROLE_ARN=$(aws iam get-role \
            --role-name "${EBS_ROLE_NAME}" \
            --query "Role.Arn" \
            --output text)

          if aws eks describe-addon \
            --cluster-name "${CLUSTER_NAME}" \
            --addon-name aws-ebs-csi-driver \
            >/dev/null 2>&1
          then
            echo "EBS CSI addon exists"
          else
            aws eks create-addon \
              --cluster-name "${CLUSTER_NAME}" \
              --addon-name aws-ebs-csi-driver \
              --service-account-role-arn "${ROLE_ARN}" \
              --resolve-conflicts OVERWRITE
          fi


      - name: Wait For EBS CSI
        shell: bash
        run: |
          set -euo pipefail

          aws eks wait addon-active \
            --cluster-name "${CLUSTER_NAME}" \
            --addon-name aws-ebs-csi-driver


      - name: Add Helm Repositories
        shell: bash
        run: |
          set -euo pipefail

          helm repo add ingress-nginx \
            https://kubernetes.github.io/ingress-nginx

          helm repo add jetstack \
            https://charts.jetstack.io

          helm repo update


      - name: Install cert-manager
        shell: bash
        run: |
          set -euo pipefail

          helm upgrade --install cert-manager \
            jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 10m


      - name: Install NGINX Ingress Controller
        shell: bash
        run: |
          set -euo pipefail

          helm upgrade --install ingress-nginx \
            ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --wait \
            --timeout 10m


      - name: Apply Kubernetes Manifests
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -f manifests/namespace.yaml

          kubectl apply \
            -f manifests/storageclass.yaml

          kubectl apply \
            -f manifests/networkpolicy.yaml

          kubectl apply \
            -R \
            -f manifests/rbac/

          kubectl apply \
            -f manifests/clusterissuer.yaml


      - name: Verify Infrastructure
        shell: bash
        run: |
          set -euo pipefail

          echo "Namespaces"
          kubectl get ns

          echo "Storage Classes"
          kubectl get storageclass

          echo "EBS CSI"
          kubectl get pods -n kube-system | grep ebs

          echo "Cert Manager"
          kubectl get pods -n cert-manager

          echo "Ingress"
          kubectl get pods -n ingress-nginx


      - name: Debug Failure
        if: failure()
        shell: bash
        run: |
          kubectl get events \
            -A \
            --sort-by=.lastTimestamp

          kubectl get pods \
            -A


      - name: Deployment Summary
        shell: bash
        run: |
          echo "================================="
          echo "Infrastructure Deployment Complete"
          echo "Cluster: ${CLUSTER_NAME}"
          echo "Region : ${AWS_REGION}"
          echo "================================="
