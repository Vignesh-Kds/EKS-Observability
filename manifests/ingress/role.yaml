---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: ingress-nginx
  namespace: ingress-nginx

rules:
  # Allow access to the ingress controller ConfigMap
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch

  # Allow leader election using ConfigMaps
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - ingress-nginx-leader
    verbs:
      - get
      - update

  # Allow creating/updating events
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch

  # Allow reading secrets for TLS certificates
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch

  # Allow managing leases for leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
