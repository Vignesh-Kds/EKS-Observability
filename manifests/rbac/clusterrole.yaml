---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: app-cluster-role

rules:
  # Core resources
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - namespaces
      - nodes
      - configmaps
      - events
    verbs:
      - get
      - list
      - watch

  # Workloads
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list
      - watch

  # Jobs
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch

  # Networking
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - ingressclasses
    verbs:
      - get
      - list
      - watch

  # Storage
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
