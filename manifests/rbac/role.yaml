apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: app-role
  namespace: default

rules:

  # Read pods and services
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch

  # Manage deployments
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Read application events
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch

  # Manage jobs
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete