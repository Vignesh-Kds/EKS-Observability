---
# Sentry Helm Values
# Project: EKS Multi-Service Application

global:
  domain: sentry.example.com

  smtp:
    enabled: true
    host: smtp.example.com
    port: 587

#############################################
# Sentry Web Service
#############################################
web:
  replicaCount: 2

  resources:
    requests:
      cpu: 500m
      memory: 1Gi

    limits:
      cpu: "1"
      memory: 2Gi

#############################################
# Background Workers
#############################################
worker:
  replicaCount: 2

  resources:
    requests:
      cpu: 500m
      memory: 1Gi

    limits:
      cpu: "1"
      memory: 2Gi

#############################################
# Cron Jobs
#############################################
cron:
  enabled: true

#############################################
# PostgreSQL Database
#############################################
postgresql:
  enabled: true

  auth:
    database: sentry
    username: sentry

  primary:
    persistence:
      enabled: true
      size: 50Gi

#############################################
# Redis
#############################################
redis:
  enabled: true

  master:
    persistence:
      enabled: true
      size: 10Gi

#############################################
# Kafka
#############################################
kafka:
  enabled: true

  persistence:
    enabled: true
    size: 50Gi

#############################################
# Zookeeper
#############################################
zookeeper:
  enabled: true

#############################################
# ClickHouse
#############################################
clickhouse:
  enabled: true

  persistence:
    enabled: true
    size: 100Gi

#############################################
# Ingress Configuration
#############################################
ingress:
  enabled: true
  ingressClassName: nginx

  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

  hosts:
    - host: sentry.example.com
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: sentry-tls
      hosts:
        - sentry.example.com

#############################################
# Security
#############################################
securityContext:
  runAsNonRoot: true

#############################################
# Kubernetes Resources
#############################################
serviceAccount:
  create: true

#############################################
# Monitoring
#############################################
metrics:
  enabled: true

serviceMonitor:
  enabled: true
  namespace: monitoring

#############################################
# External Secret Integration
#############################################
secrets:
  existingSecret: sentry-secret

#############################################
# Environment
#############################################
env:
  SENTRY_ENVIRONMENT: production
  SENTRY_LOG_LEVEL: INFO

#############################################
# Backup
#############################################
backup:
  enabled: true
  schedule: "0 2 * * *"
  retentionDays: 7
