---
apiVersion: v1
kind: Secret

metadata:
  name: sentry-secret
  namespace: production

  labels:
    app.kubernetes.io/name: sentry
    app.kubernetes.io/component: monitoring

type: Opaque

stringData:
  # Sentry Project DSN
  # Replace with actual DSN from Sentry project settings
  SENTRY_DSN: "https://<public-key>@sentry.io/<project-id>"

  # Sentry Authentication Token
  # Used for CI/CD release creation and source map upload
  SENTRY_AUTH_TOKEN: "<sentry-auth-token>"

  # Organization Slug
  SENTRY_ORG: "<organization-name>"

  # Project Slug
  SENTRY_PROJECT: "<project-name>"
