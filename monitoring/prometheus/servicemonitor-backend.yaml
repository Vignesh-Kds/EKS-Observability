---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: backend-service-monitor
  namespace: monitoring

  labels:
    release: prometheus

spec:
  # Select backend service
  selector:
    matchLabels:
      app: backend

  # Namespace where backend service exists
  namespaceSelector:
    matchNames:
      - production

  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
