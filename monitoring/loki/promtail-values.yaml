---
# Promtail Helm Values
# Kubernetes container log collector for Loki

config:
  clients:
    - url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push

  snippets:
    pipelineStages:
      # Parse Docker/Containerd JSON logs
      - cri: {}

      # Add Kubernetes metadata
      - match:
          selector: '{app=~".+"}'
          stages:
            - labels:
                app:

            - labels:
                namespace:

            - labels:
                pod:

    scrapeConfigs:
      - job_name: kubernetes-pods

        kubernetes_sd_configs:
          - role: pod

        relabel_configs:
          # Namespace label
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace

          # Pod name label
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod

          # Container name label
          - source_labels:
              - __meta_kubernetes_pod_container_name
            target_label: container

          # Application label
          - source_labels:
              - __meta_kubernetes_pod_label_app
            target_label: app

          # Log path
          - source_labels:
              - __meta_kubernetes_pod_uid
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log


# Run Promtail on every Kubernetes node
daemonset:
  enabled: true


# Resource configuration
resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 300m
    memory: 256Mi


# Mount node log directories
extraVolumes:
  - name: varlog
    hostPath:
      path: /var/log

  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers


extraVolumeMounts:
  - name: varlog
    mountPath: /var/log

  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true


# Security settings
securityContext:
  runAsUser: 0


serviceMonitor:
  enabled: true
