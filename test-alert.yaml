apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: test-alert
  namespace: monitoring
spec:
  groups:
    - name: test.rules
      rules:
        - alert: ChatGPTTestAlert
          expr: vector(1)
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "Test alert"
            description: "This is a test alert generated for Alertmanager."
