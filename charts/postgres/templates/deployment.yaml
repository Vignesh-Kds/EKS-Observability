---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "postgres.fullname" . }}
  namespace: {{ .Release.Namespace }}

  labels:
    {{- include "postgres.labels" . | nindent 4 }}


spec:

  replicas: {{ .Values.replicaCount }}


  selector:

    matchLabels:
      {{- include "postgres.selectorLabels" . | nindent 6 }}



  template:

    metadata:

      labels:
        {{- include "postgres.selectorLabels" . | nindent 8 }}



    spec:

      serviceAccountName: {{ include "postgres.serviceAccountName" . }}

      automountServiceAccountToken: false



      ########################################
      # Pod Security Context
      ########################################

      securityContext:

        runAsNonRoot: true

        runAsUser: 999

        runAsGroup: 999

        fsGroup: 999

        fsGroupChangePolicy: OnRootMismatch


        seccompProfile:

          type: RuntimeDefault




      ########################################
      # Fix EBS Volume Permissions
      ########################################

      initContainers:


        - name: postgres-init-permissions

          image: busybox:1.36


          command:

            - sh

            - -c

            - |

              mkdir -p /var/lib/postgresql/data/pgdata

              chown -R 999:999 /var/lib/postgresql/data



          securityContext:

            runAsUser: 0

            runAsNonRoot: false



          volumeMounts:


            - name: postgres-storage

              mountPath: /var/lib/postgresql/data





      ########################################
      # PostgreSQL Container
      ########################################

      containers:


        - name: postgres


          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"


          imagePullPolicy: {{ .Values.image.pullPolicy }}



          securityContext:


            allowPrivilegeEscalation: false


            runAsNonRoot: true


            runAsUser: 999


            runAsGroup: 999



            capabilities:

              drop:

                - ALL



            seccompProfile:

              type: RuntimeDefault





          ports:


            - name: postgres

              containerPort: {{ .Values.service.targetPort }}

              protocol: TCP





          ####################################
          # Environment Variables
          ####################################

          env:


            - name: POSTGRES_DB

              value: {{ .Values.config.POSTGRES_DB | quote }}



            - name: POSTGRES_USER

              valueFrom:

                secretKeyRef:

                  name: {{ include "postgres.fullname" . }}

                  key: POSTGRES_USER




            - name: POSTGRES_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: {{ include "postgres.fullname" . }}

                  key: POSTGRES_PASSWORD




            # Important for EBS volumes
            - name: PGDATA

              value: /var/lib/postgresql/data/pgdata





          ####################################
          # Storage Mounts
          ####################################

          volumeMounts:



            - name: postgres-storage

              mountPath: /var/lib/postgresql/data



            - name: postgres-run

              mountPath: /var/run/postgresql



            - name: postgres-tmp

              mountPath: /tmp





          ####################################
          # Resources
          ####################################

          resources:


            requests:

              cpu: {{ .Values.resources.requests.cpu }}

              memory: {{ .Values.resources.requests.memory }}



            limits:

              cpu: {{ .Values.resources.limits.cpu }}

              memory: {{ .Values.resources.limits.memory }}






          ####################################
          # Health Checks
          ####################################

          livenessProbe:


            exec:

              command:

                - pg_isready

                - "-U"

                - {{ .Values.secret.postgresUser | quote }}



            initialDelaySeconds: 60

            periodSeconds: 10

            timeoutSeconds: 5

            failureThreshold: 5




          readinessProbe:


            exec:

              command:

                - pg_isready

                - "-U"

                - {{ .Values.secret.postgresUser | quote }}



            initialDelaySeconds: 30

            periodSeconds: 5

            timeoutSeconds: 3

            failureThreshold: 5





      ########################################
      # Volumes
      ########################################

      volumes:



        - name: postgres-storage


          persistentVolumeClaim:


            claimName: {{ include "postgres.fullname" . }}-pvc




        - name: postgres-run


          emptyDir: {}




        - name: postgres-tmp


          emptyDir: {}
