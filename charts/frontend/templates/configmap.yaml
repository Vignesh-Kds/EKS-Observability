apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}

data:
  API_URL: {{ .Values.config.API_URL | quote }}
  APP_NAME: {{ .Values.config.APP_NAME | quote }}
  NODE_ENV: {{ .Values.config.NODE_ENV | quote }}